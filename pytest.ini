[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    r1_metabolic_model: Tests for Requirement 1 (Stoichiometrically Balanced Two-Compartment Model)
    r2_simulation_engine: Tests for Requirement 2 (FBA Simulation & 3D Tensor Engine)
    r3_visualizer_3d: Tests for Requirement 3 (Interactive 3D Biological Twin & Phase Surfaces)
    r4_app_components: Tests for Requirement 4 (Streamlit Scientific Web Application)
    r5_scientific_hypotheses: Tests for Requirement 5 (Philippine Seasonal Regimes & Hypotheses)
    tier1: Tier 1 Functional Feature Coverage
    tier2: Tier 2 Boundary & Corner Cases
    tier3: Tier 3 Combinatorial & Cross-Feature Interactions
    tier4: Tier 4 Real-World Application Scenarios
filterwarnings =
    ignore::DeprecationWarning
